  custom-attributes: 
  - # ====== Custom Attribute: File Processing JavaScript Function
    id: 234328656878900972748
    identification: 
      attribute: 11
      name: File Processing JavaScript Function
      scope: Component

    layout: 
      sequence: 110

    settings: 
      type: JavaScript Code
      common: true
      show-in-wizard: true
      required: false
      translatable: false

    help: 
      help-text: 'Provide an optional async JavaScript function to do file manipulations before the file gets uploaded to the server. To add metadata to a file use <i>file._metadata = {}</i>, this can then be used with the bind variable <i>:APEX$METADATA</i> on the server. To cancel the upload of a given file, just add <i>file._cancel = true</i> flag.'

    examples: 
      examples: |
        <pre>
        async function( file ) {
            file._metadata = { "field1": "value1", "field2": "value2" };
            return file;
        }
        </pre>
        
        <pre>
        async function( file ) {
        
            if ( file.type.startsWith( "image/" ) ) {
                file._metadata = await getEXIFMetadata( file );
            }
        
            if ( file.type.startsWith( "audio/" ) ) {
                const tags = await getAudioMetadata( file );
                file._metadata = {
                    artist: tags.artist,
                    title: tags.title,
                    album: tags.album,
                    year: tags.year
                }
            }
        
            if ( file.name.toLowerCase().endsWith( ".txt" ) ) {
                file._cancel = true;
            }
        
            return file;
        }
        </pre>

