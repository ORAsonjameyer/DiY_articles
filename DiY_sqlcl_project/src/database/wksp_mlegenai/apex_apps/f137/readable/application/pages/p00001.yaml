- # ====== Region: Timeline ====================================
  id: 233238220991885180919
  identification: 
    name: Timeline
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
      p.id,
      p.created_by AS user_name,
      p.post_comment AS comment_text,
      p.file_blob,
      p.file_mime,
      apex_util.get_since(p.created) post_date,
      (
      select count(*) from SM_REACTIONS smr
      where smr.post_id=p.id
      ) as REACTIONS,
      (
      select 'user-has-liked' from SM_REACTIONS smr
      where smr.post_id=p.id and created_by=UPPER(:APP_USER)
      ) USER_REACTION_CSS
      from SM_POSTS p
      where (:P1_AI_SEARCH IS NOT NULL AND
      (upper(ai_output) like upper('%'||:P1_AI_SEARCH||'%') OR upper(ai_output_td) like upper('%'||:P1_AI_SEARCH||'%')
      )
      )OR :P1_AI_SEARCH IS NULL
      order by p.created desc;
      
    page-items-to-submit: 
    - P1_AI_SEARCH

  order-by: 
    type: None

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: false
    column: Automatic
    new-column: false
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    css-classes: 
    - t-Chat
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
