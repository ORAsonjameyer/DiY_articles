- # ====== Process: Extract EXIF Data ==========================
  id: 136454019674689821
  identification: 
    name: Extract EXIF Data
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: JavaScript (MLE)
    javascript-code: |
      const { default: exifr } = await import ('exifr');
      
      const d = plsffi.resolvePackage('APEX_DEBUG');
      
      let result = apex.conn.execute(`
              select
                  file_blob
              from
                  sm_posts
              where
                  id = :id`,
         {
              id: {
                  val: apex.env.P1_ID
              }
         },
         {
              fetchInfo: {
                  FILE_BLOB: {
                      type: oracledb.UINT8ARRAY
                  }
              }
          });
      
      d.info(`fetched ${result.rows.length} row(s)`);
      
      if (result.rows.length === 1) {
      
        const exifData = await exifr.parse(result.rows[0].FILE_BLOB.buffer);
      
        d.info('no error during EXIF parse');
      
        if (!exifData || exifData === undefined) {
          d.info(`no exif data found for image ${apex.env.P1_ID}`);
          return;
        }
      
        result = apex.conn.execute(
          `update
            sm_posts
          set
            exif_data = :data,
            lon = :lon,
            lat = :lat
          where
            id = :id`,
          {
            data: {
              type: oracledb.DB_TYPE_JSON,
              val: exifData
            },
            lon: {
              type: oracledb.NUMBER,
              val: exifData.longitude === undefined ? null : exifData.longitude
            },
            lat: {
              type: oracledb.NUMBER,
              val: exifData.latitude === undefined ? null : exifData.latitude
            },
            id: {
              val: apex.env.P1_ID
            }
          }
        );
      
        d.info(`${result.rowsAffected} rows have been updated with lon ${exifData.longitude} and lat ${exifData.latitude}`);
        
      }

  execution: 
    sequence: 30
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

