services:
    oraclefree:
        image: ghcr.io/gvenzl/oracle-free
        ports:
            - 1522:1521
        volumes:
            - ora_db_vol:/opt/oracle/oradata
        networks:
            - ora_app_network
        healthcheck:
            test: [ "CMD", "/opt/oracle/healthcheck.sh" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 5s
        environment:
            - ORACLE_PASSWORD_FILE=/run/secrets/oracle_dba_pwd
        secrets:
            - oracle_dba_pwd

    ords:
        depends_on:
            oraclefree:
                condition: service_healthy

        image: container-registry.oracle.com/database/ords
        networks:
            - ora_app_network
        volumes:
            - ords_config_vol:/etc/ords/config
            - ./setup:/opt/oracle/variables:Z
        ports:
            - 8181:8181

volumes:
    ora_db_vol:
    ords_config_vol:


secrets:
    oracle_dba_pwd:
        external: true

networks:
    ora_app_network:
