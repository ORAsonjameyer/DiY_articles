- # ====== Region: Timeline Details ============================
  id: 135402373397911963
  identification: 
    name: Timeline Details
    type: Form

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          id,
          jt.*
      from
          sm_posts,
          json_table(
              sm_posts.exif_data, '$'
              columns (
                  make          varchar2(150) path '$.Make',
                  model         varchar2(150) path '$.Model',
                  lens_make     varchar2(150) path '$.LensMake',
                  lens_model    varchar2(150) path '$.LensModel',
                  focal_length  varchar2(150) path '$.FocalLength',
                  exposure_time number        path '$.ExposureTime',
                  aperture      number        path '$.ApertureValue',
                  iso           number        path '$.ISO',
                  flash         varchar2(150) path '$.Flash',
                  latitude      number        path '$.latitude',
                  longitude     number        path '$.longitude'
              )
          ) jt

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    edit: 
      enabled: true
      allowed-operations: 
      - Add Row
      - Update Row
      - Delete Row
      lost-update-type: Row Values

